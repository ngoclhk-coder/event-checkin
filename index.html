<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Event Check-in</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
    }

    h1 {
      margin-top: 0;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      font-size: 18px;
    }

    .success {
      background: #dff6e4;
      color: #146c2e;
    }

    .error {
      background: #fde2e2;
      color: #a30000;
    }

    .duplicate {
      background: #fff1cc;
      color: #805b00;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>🎫 EVENT CHECK-IN</h1>

  <p>
    Cho phép camera và đưa QR vào khung
  </p>

  <div id="reader"></div>

  <div id="result">
    📷 Đang chuẩn bị camera...
  </div>

</div>


<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxCPnw14dDdVJ09UbM840UXOqbLJ_v_DM2fE3kTQjB0Io2BQvsYFofD7KtFa7UGz-6GmQ/exec";


let scanner = null;
let scanning = true;


function onScanSuccess(decodedText) {

  if (!scanning) {
    return;
  }

  scanning = false;

  document.getElementById("result").className = "";

  document.getElementById("result").innerHTML =
    "⏳ Đang kiểm tra...";


  const callbackName =
    "callback_" + Date.now();


  window[callbackName] = function(result) {

    showResult(result);

    delete window[callbackName];

  };


  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?code=" +
    encodeURIComponent(decodedText) +
    "&callback=" +
    callbackName;


  script.onerror = function() {

    document.getElementById("result").className =
      "error";

    document.getElementById("result").innerHTML =
      "❌ Không kết nối được hệ thống.";

    scanning = true;

  };


  document.body.appendChild(script);

}


function showResult(result) {

  const box =
    document.getElementById("result");


  if (result.success) {

    box.className = "success";

    box.innerHTML =
      "✅ <b>CHECK-IN THÀNH CÔNG</b><br><br>" +
      "<b>" + result.name + "</b><br>" +
      (result.company || "");

  }

  else if (result.duplicate) {

    box.className = "duplicate";

    box.innerHTML =
      "⚠️ <b>ĐÃ CHECK-IN</b><br><br>" +
      "<b>" + result.name + "</b><br>" +
      (result.company || "") +
      "<br><br>" +
      result.message;

  }

  else {

    box.className = "error";

    box.innerHTML =
      "❌ <b>QR KHÔNG HỢP LỆ</b><br><br>" +
      result.message;

  }


  setTimeout(function() {

    scanning = true;

    box.innerHTML =
      "📷 Sẵn sàng quét QR tiếp theo";

    box.className = "";

  }, 3000);

}


/* =========================
   KHỞI ĐỘNG CAMERA
========================= */

scanner =
  new Html5QrcodeScanner(

    "reader",

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera: true,

      supportedScanTypes: [
        Html5QrcodeScanType.SCAN_TYPE_CAMERA
      ]
    },

    false

  );


scanner.render(
  onScanSuccess,
  function(error) {}
);

</script>

</body>

</html>
